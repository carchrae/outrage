[build]
  publish = "public"
  # Stamp the commit hash into index.html's asset URLs so a new deploy is
  # picked up on the next normal visit, with no hard reload needed.
  command = "node scripts/stamp.js"

# Push alerts: netlify/functions/subscribe.mjs (POST/DELETE /api/subscribe) and the 10-minute
# netlify/functions/check-feeds.mjs. Both need VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and
# VAPID_SUBJECT set in the site's environment (see README).
[functions]
  node_bundler = "esbuild"

# Netlify proxies these paths server-side, which sidesteps the missing CORS
# headers on BC Hydro's feed. The browser only ever talks to this site.
[[redirects]]
  from = "/api/planned"
  to = "https://www.bchydro.com/power-outages/app/outages-list-data-planned.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/current"
  to = "https://www.bchydro.com/power-outages/app/outages-list-data-current.json"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=120"

# index.html is always revalidated, so every visit sees the newest asset
# URLs. The versioned assets themselves can be cached for a long time.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and manifest must never be served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
